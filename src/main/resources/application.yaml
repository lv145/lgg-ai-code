spring:
  application:
    name: lgg-aicode
  profiles:
    active: local
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.159.110:3306/lgg_ai_code
    username: root
    password: 123
  data:
    redis:
      host: 192.168.159.110
      port: 6379
      password: 123
      ttl: 3600
      username: default
      database: 0
  session:
    store-type: redis  # 会话存储类型，可选值：redis、http、native
    timeout: 2592000  # 30天 会话过期时间，单位秒

# 阿里云 DashScope 配置
dashscope:
  api-key:
  #  image-model: wan2.2-t2i-flash
  image-model: wan2.2-t2i-flash


#Pexels图片搜索配置
pexels:
  api-key:
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000  # 30天 会话过期时间，单位秒

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key:
      model-name: qwen3.7-flash
      max-tokens: 8192
      temperature: 0.1 # 温度参数，控制生成文本的随机性
      log-requests: true
      log-responses: true
      max-retries: 3


    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key:
      model-name: qwen3.7-flash
      #      max-tokens: 8192
      temperature: 0.1 # 温度参数，控制生成文本的随机性
      log-requests: true
      log-responses: true

    # 智能路由AI模型配置(用于简单的分类任务)
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key:
      model-name: qwen3.7-flash
      log-requests: true
      log-responses: true
      max-retries: 3
    #      max-tokens: 8192
    #      strict-json-schema: true
    #     响应格式为 JSON 对象
    #      response-format: json_object
    #推理AI模型(用于复杂的推理任务)
    reasoning-streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key:
      model-name: qwen3.7-max
      max-tokens: 32768
      temperature: 0.1 # 温度参数，控制生成文本的随机性
      log-requests: true
      log-responses: true


# 配置Knife4j
knife4j:
  enabled: true
  setting:
    language: zh_cn
# 配置SpringDoc
springdoc:
  group-configs:
    - group: "default"
      packages-to-scan: com.lgg.lggaicode.controller
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: url
    secretId: secretId
    secretKey: secretKey
    region: ap-shanghai
    bucket: bucket-name
